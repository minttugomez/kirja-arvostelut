{% extends "layout.html" %}

{% block title %}Delete Review{% endblock %}

{% block content %}

<h2>Delete Review</h2>

{% for category, message in get_flashed_messages(with_categories=true) %}
<p class="{{ category }}">
  {{ message }}
</p>
{% endfor %}

<form action="/delete/{{ book_review.id }}" method="post">
  <p>
    Are you sure you want to delete the review "{{ book_review.title }}"?
  </p>
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" name="continue" value="Yes, delete" />
  <input type="submit" name="cancel" value="Cancel" />
</form>

{% endblock %}
