{% extends "layout.html" %}

{% block title %}Edit Review{% endblock %}

{% block content %}

<h2>Edit Review</h2>

{% for category, message in get_flashed_messages(with_categories=true) %}
<p class="{{ category }}">
  {{ message }}
</p>
{% endfor %}

<form action="/update/{{ book_review.id }}" method="post">
  <p>
    <label for="title">Title:</label><br />
    <input type="text" id="title" name="title" value="{{ book_review.title }}" maxlength="100" required />
  </p>
  <p>
    <label for="author">Author:</label><br />
    <input type="text" id="author" name="author" value="{{ book_review.author }}" maxlength="100" required />
  </p>
  <p>
    <label for="review">Review:</label><br />
    <textarea id="review" name="review" rows="5" cols="40" maxlength="5000" required>{{ book_review.review }}</textarea>
  </p>
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" value="Update Review" />
</form>

<p>
  <a href="/yourpage">Cancel</a>
</p>

{% endblock %}
