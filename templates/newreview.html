{% extends "layout.html" %}

{% block title %}New Review{% endblock %}

{% block content %}
<h1>New Review</h1>
<form action="/add" method="POST" class="review-form">
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <label>Title:</label><br>
  <input type="text" name="title" value="{{ filled.title }}" required><br>
  <label>Author:</label><br>
  <input type="text" name="author" value="{{ filled.author }}" required><br>
  {% for title in classes %}
  <label>{{ title }}:</label>
  <div class="genres">
    {% for value in classes[title] %}
    <label>
      <input type="checkbox" name="classes" value="{{ title }}:{{ value }}"
        {% if (title ~ ":" ~ value) in selected %}checked{% endif %} />
      {{ value }}
    </label>
    {% endfor %}
  </div>
  {% endfor %}
  <label>Review:</label><br>
  <textarea name="review" required>{{ filled.review }}</textarea><br>
  <button type="submit">Add Review</button>
</form>

<br/><a href="/user/{{ user_id }}">Cancel</a>
{% endblock %}
